databases:
  - name: qazaq-locqa-db
    databaseName: qazaq_locqa
    user: qazaq_locqa_user
    plan: free

services:
  - type: web
    name: qazaq-locqa-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: qazaq-locqa-db
          property: connectionString
      - key: QAZAQ_LOCQA_MAX_UPLOAD_MB
        value: "25"
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
      - key: LLM_PROVIDER
        value: "gemini"
      - key: LLM_MODEL
        value: "gemini-2.5-flash"
      - key: LLM_API_KEY
        sync: false
